



version: "2"

sql:
  - engine: "postgresql"
    queries: "./database/db/querys"
    schema: "./database/migrations"

    gen:
      go:
        package: "database"
        out: "./database/db"
        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "timestamp"
            go_type: "time.Time"

          - db_type: "timestamptz"
            go_type: "time.Time"
